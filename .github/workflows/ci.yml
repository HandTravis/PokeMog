name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Run pytest suite
    runs-on: ubuntu-latest

    services:
      # Postgres is required for FastAPI's lifespan to initialize cleanly,
      # even though tests use SQLite in-memory for actual test data.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pokeranker
          POSTGRES_PASSWORD: pokeranker
          POSTGRES_DB: pokeranker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://pokeranker:pokeranker@localhost:5432/pokeranker
          PYTHONPATH: .
        run: pytest --tb=short -q