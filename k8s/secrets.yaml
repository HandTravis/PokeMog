apiVersion: v1
kind: Secret
metadata:
  name: pokeranker-secrets
  namespace: pokeranker
type: Opaque
stringData:
  # plaintext here — k8s will base64-encode them automatically
  # In production, use Sealed Secrets or a secrets manager instead
  POSTGRES_USER: pokeranker
  POSTGRES_PASSWORD: pokeranker
  POSTGRES_DB: pokeranker
  DATABASE_URL: postgresql://pokeranker:pokeranker@postgres-service:5432/pokeranker
